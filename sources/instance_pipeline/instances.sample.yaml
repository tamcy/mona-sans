# Custom instance config for sources/instance_pipeline/build_instances.py
#
# Notes:
# - Axis values in `location` are interpreted in USER space and validated
#   against designspace bounds.
# - Axis values in `design_location` are DESIGN-SPACE values and bypass
#   the user→design axis map entirely — useful for `opsz` (see below).
# - Out-of-range values fail hard.
# - Use presets for repeatable named test sets.
#
# ── opsz axis explanation ────────────────────────────────────────────────────
# The opsz axis in this source has a non-monotonic user→design map:
#
#   user-space | design-space | approx blend
#   -----------+--------------+-------------------------------------
#       0      |    100       | 100% Display  ← the DEFAULT
#      14      |     60.8     |  61% Display  ← opsz:14 in user space!
#      20      |     44       |  43% Display  ← closest to Text in user space
#      72      |     80       |  80% Display
#     100      |    100       | 100% Display
#
# The Text masters live at design=1.  No user-space value reaches them.
# To target Text or Display masters directly, use `design_location`:
#
#   design_location: { opsz: 1   }   → pure Text masters
#   design_location: { opsz: 44  }   → ~43% Display (blended, closest from user space)
#   design_location: { opsz: 100 }   → pure Display masters
#
# You can mix both dicts: `location` handles wdth/wght/ital in user space,
# `design_location` handles opsz in design space.
# ─────────────────────────────────────────────────────────────────────────────

familyName: "Mona Sans Fork"

# Optional: narrow bounds (cannot exceed designspace bounds).
# bounds:
#   wdth: { min: 75, max: 125 }
#   wght: { min: 100, max: 900 }
#   opsz: { min: 0, max: 100 }
#   ital: { min: 0, max: 1 }

# Default instances loaded on every run.
# Can be run without any flags: `python build_instances.py`
# During exploration: keep this empty
# instances: []
instances:
  - name: "Fork Trial RegularText"
    location: { wdth: 100, wght: 200, ital: 0 }
    design_location: { opsz: 1 }   # pure Text masters

## python build_instances.py --preset zev_masters
presets:
  zev_masters:
    - name: "ZevSans W200 S75"
      location: { wdth: 85.0, wght: 200, ital: 0 }
      design_location: { opsz: 40 }
    - name: "ZevSans W900 S75"
      location: { wdth: 85.0, wght: 830, ital: 0 }
      design_location: { opsz: 80 }
    - name: "ZevSans W200 S100"
      location: { wdth: 100, wght: 200, ital: 0 }
      design_location: { opsz: 40 }
    - name: "ZevSans W900 S100"
      location: { wdth: 100, wght: 830, ital: 0 }
      design_location: { opsz: 80 }
    - name: "ZevSans W200 S125"
      location: { wdth: 125, wght: 200, ital: 0 }
      design_location: { opsz: 40 }
    - name: "ZevSans W900 S125"
      location: { wdth: 125, wght: 830, ital: 0 }
      design_location: { opsz: 80 }

